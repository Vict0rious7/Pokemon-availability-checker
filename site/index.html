<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pokémon availability checker</title>
    <meta name="description" content="Which Pokémon can you bring to Pokémon HOME or a game with what you own — and which must move before Pokémon Bank closes on 25 February 2027?" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500&display=swap" rel="stylesheet" />
    <script>try { document.documentElement.dataset.theme = localStorage.getItem("theme") || "boxes"; } catch (e) { document.documentElement.dataset.theme = "boxes"; }</script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>This checker needs JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
